<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="100%" height="100%">
  <defs>
    <linearGradient id="canikGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d8f4e"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="canikAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(10, 10)" filter="url(#logoShadow)">
    <!-- Base geometric block -->
    <rect x="0" y="24" width="22" height="56" rx="4" fill="url(#canikGreenGrad)" opacity="0.9"/>
    <rect x="26" y="10" width="26" height="70" rx="5" fill="url(#canikGreenGrad)"/>
    <rect x="56" y="32" width="22" height="48" rx="4" fill="url(#canikGreenGrad)" opacity="0.75"/>
    
    <!-- Architectural roof / transform apex line -->
    <path d="M 0 24 L 39 0 L 78 32" fill="none" stroke="url(#canikAccentGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Windows accents -->
    <rect x="32" y="20" width="5" height="7" rx="1.5" fill="#ffffff" opacity="0.85"/>
    <rect x="41" y="20" width="5" height="7" rx="1.5" fill="#ffffff" opacity="0.85"/>
    <rect x="32" y="33" width="5" height="7" rx="1.5" fill="#ffffff" opacity="0.85"/>
    <rect x="41" y="33" width="5" height="7" rx="1.5" fill="#ffffff" opacity="0.85"/>
    <rect x="32" y="46" width="5" height="7" rx="1.5" fill="#ffffff" opacity="0.85"/>
    <rect x="41" y="46" width="5" height="7" rx="1.5" fill="#ffffff" opacity="0.85"/>
    
    <!-- Dynamic renewal swoosh (Kentsel Dönüşüm) -->
    <path d="M 6 72 Q 40 86 76 68" fill="none" stroke="url(#canikAccentGrad)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(105, 0)">
    <text x="0" y="48" font-family="'Poppins', 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="800" fill="#0f172a" letter-spacing="1">
      CANİK<tspan fill="#166534">OĞLU</tspan>
    </text>
    <text x="2" y="74" font-family="'Poppins', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#d97706" letter-spacing="4.5">
      İNŞAAT &amp; KENTSEL DÖNÜŞÜM
    </text>
    <text x="2" y="88" font-family="'Poppins', 'Segoe UI', system-ui, sans-serif" font-size="8.5" font-weight="500" fill="#64748b" letter-spacing="1.2">
      PROJE • MÜTEAHHİTLİK • ANAHTAR TESLİM • PEYZAJ
    </text>
  </g>
</svg>
