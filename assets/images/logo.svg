<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="460" height="90">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ca8cb"/>
      <stop offset="50%" stop-color="#0f7c99"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa820a"/>
    </linearGradient>
  </defs>
  
  <!-- Architectural Icon -->
  <g transform="translate(10, 8)">
    <!-- Outer Diamond / Hexagon Arch -->
    <polygon points="36,4 68,22 68,54 36,72 4,54 4,22" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Inner Architecture Structure -->
    <path d="M36,12 L36,64 M20,28 L36,18 L52,28 M20,44 L36,34 L52,44" fill="none" stroke="#252525" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="36" cy="12" r="3.5" fill="url(#goldAccent)"/>
    <rect x="33" y="62" width="6" height="4" fill="url(#goldAccent)"/>
  </g>

  <!-- Typography -->
  <g transform="translate(92, 0)">
    <text x="0" y="38" font-family="'Teko', 'Poppins', sans-serif" font-size="34" font-weight="700" letter-spacing="2.5" fill="#16213e">CANİKOĞLU &amp; TOPÇU</text>
    <text x="0" y="62" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" letter-spacing="4.5" fill="#1ca8cb">MİMARLIK &amp; İNŞAAT A.Ş.</text>
    <text x="0" y="78" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="500" letter-spacing="1.5" fill="#777777">KENTSEL DÖNÜŞÜM &amp; MÜHENDİSLİK</text>
  </g>
</svg>
